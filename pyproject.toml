[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xair-network-bridge"
version = "0.1.0"
description = "X-Air Network Bridge — X18 USB to UDP network audio"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
  "sounddevice>=0.4.6",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1",
  "click>=8.1.7",
  "soundfile>=0.12.1",
  "JACK-Client>=0.5.3",
  "python-osc>=1.8.0",
]

[project.scripts]
xair-network-bridge = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
